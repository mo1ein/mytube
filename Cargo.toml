[package]
name = "mytube"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
description = "A fast, private desktop library for local videos"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
directories = "6"
dunce = "1"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.8.9"
rfd = "0.17.2"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
tempfile = "3"
trash = "5"
unicode-bidi = "0.3.18"
wait-timeout = "0.2"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSAppearance", "NSCell", "NSGlassEffectView", "NSGraphics", "NSColor", "NSMenu", "NSMenuItem", "NSImage", "NSApplication", "NSResponder", "NSSharingService", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSGeometry", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "NSURL", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
percent-encoding = "2"
zbus = "5"

[profile.dev]
debug = 0

[build-dependencies]
cc = "1"

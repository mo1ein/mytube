name: Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (leave empty for a verification run)
        type: string
        required: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: mytube-linux-x64
          - os: macos-26
            artifact: mytube-macos-26-arm64
          - os: macos-15
            artifact: mytube-macos-arm64
          - os: windows-2025
            artifact: mytube-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Read release version
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag $RELEASE_TAG must match Cargo.toml (v$version)"
            exit 1
          fi
          echo "PACKAGE_NAME=mytube-$version-${ARTIFACT#mytube-}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libx11-dev libwayland-dev ffmpeg
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build desktop binary
        if: runner.os != 'Windows'
        run: cargo build --release --locked
      - name: Build Windows desktop binary with the static C runtime
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Build Debian installer
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build.sh
          test "$(dpkg-deb -f target/install/linux/*.deb Version)" = "$PACKAGE_VERSION"
      - name: Install Ubuntu package through curl and launch it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          site="$RUNNER_TEMP/mytube-install-test"
          tag="v$PACKAGE_VERSION"
          mkdir -p "$site/$tag/packaging" "$site/releases/download/$tag"
          cp packaging/install.sh "$site/$tag/packaging/"
          cp target/install/linux/*.deb "$site/releases/download/$tag/"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$site" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          base="http://127.0.0.1:8765"
          export MYTUBE_RELEASE="$base/releases/download/$tag"
          curl -fsSL --retry 5 --retry-connrefused "$base/$tag/packaging/install.sh" -o "$RUNNER_TEMP/install-mytube.sh"
          sh "$RUNNER_TEMP/install-mytube.sh" <<< 'Y'
          for tool in ffmpeg ffprobe curl xdg-open zenity; do command -v "$tool"; done
          cargo test --locked native_tools_apply_to_decoded_video -- --ignored
          test -x /usr/bin/mytube
          mkdir -p "$RUNNER_TEMP/mytube-empty"
          export MYTUBE_DATA_DIR="$RUNNER_TEMP/mytube-smoke"
          export MYTUBE_SCAN_ROOTS="$RUNNER_TEMP/mytube-empty"
          timeout 12 xvfb-run -a mytube || test "$?" = 124
          test -s "$MYTUBE_DATA_DIR/library.sqlite3"
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg mpv
          packaging/macos/build.sh
          codesign --verify --strict target/install/macos/MyTube.app
          plutil -lint target/install/macos/MyTube.app/Contents/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw target/install/macos/MyTube.app/Contents/Info.plist)" = "$PACKAGE_VERSION"
          ditto -c -k --norsrc --noextattr target/install/macos "target/install/$PACKAGE_NAME.zip"
          python3 packaging/macos/build-dmg.py target/install/macos/MyTube.app "target/install/$PACKAGE_NAME.dmg"
      - name: Launch packaged macOS app
        if: runner.os == 'macOS'
        run: |
          export MYTUBE_DATA_DIR="$RUNNER_TEMP/mytube-smoke"
          mkdir -p "$RUNNER_TEMP/mytube-empty"
          export MYTUBE_SCAN_ROOTS="$RUNNER_TEMP/mytube-empty"
          mountpoint="$RUNNER_TEMP/mytube-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "target/install/$PACKAGE_NAME.dmg"
          trap 'hdiutil detach "$mountpoint"' EXIT
          test "$(readlink "$mountpoint/Applications")" = /Applications
          ditto "$mountpoint/MyTube.app" "$RUNNER_TEMP/MyTube.app"
          hdiutil detach "$mountpoint"
          trap - EXIT
          contents="$RUNNER_TEMP/MyTube.app/Contents"
          export PATH="$contents/MacOS:$PATH"
          export MYTUBE_LIBMPV="$contents/MacOS/libmpv.2.dylib"
          "$contents/MacOS/ffprobe" -version
          cargo test --locked native_tools_apply_to_decoded_video -- --ignored
          "$contents/MacOS/mytube" &
          player_pid=$!
          trap 'kill "$player_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if [ -s "$MYTUBE_DATA_DIR/library.sqlite3" ] && sqlite3 "$MYTUBE_DATA_DIR/library.sqlite3" 'SELECT theme FROM appearance LIMIT 1' 2>/dev/null | grep -q .; then
              exit 0
            fi
            kill -0 "$player_pid"
            sleep 1
          done
          exit 1
      - name: Build Windows installer archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'packaging/windows/Install MyTube.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors -join "`n") }
          New-Item -ItemType Directory -Path target/install/windows -Force | Out-Null
          Copy-Item -Path 'packaging/windows/*','target/x86_64-pc-windows-msvc/release/mytube.exe','assets/*-LICENSE.txt' -Destination target/install/windows
          Compress-Archive -Path 'target/install/windows/*' -DestinationPath "target/install/$env:PACKAGE_NAME.zip"
      - name: Install Windows package and test playback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MYTUBE_RELEASE = ([uri](Resolve-Path 'target/install').Path).AbsoluteUri.TrimEnd('/')
          $bootstrap = Join-Path $env:RUNNER_TEMP 'install-mytube.cmd'
          Copy-Item 'packaging/install.sh' $bootstrap
          & $bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\MyTube'
          $env:Path = "$installed;$env:Path"
          $env:MYTUBE_LIBMPV = Join-Path $installed 'libmpv-2.dll'
          cargo test --locked native_tools_apply_to_decoded_video -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Installed playback runtime failed' }
      - name: Launch packaged Windows app with software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\MyTube'
          # Supply OpenGL to the hosted runner without changing the release ZIP or system driver.
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa3d-26.3.1-release-msvc.7z'
          curl.exe --fail --location --silent --show-error --retry 2 --output $mesa https://github.com/pal1000/mesa-dist-win/releases/download/26.3.1/mesa3d-26.3.1-release-msvc.7z
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the CI OpenGL driver' }
          if ((Get-FileHash -LiteralPath $mesa -Algorithm SHA256).Hash -ne '64E84CF13D67DD354640BF443ED0445E6A83AFD06A5729F0750B3744D633B3F1') {
            throw 'CI OpenGL driver checksum mismatch'
          }
          $mesaDir = Join-Path $env:RUNNER_TEMP 'mytube-mesa'
          New-Item -ItemType Directory -Path $mesaDir -Force | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $mesa -C $mesaDir x64/opengl32.dll x64/libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the CI OpenGL driver' }
          Copy-Item -LiteralPath (Join-Path $mesaDir 'x64\opengl32.dll'), (Join-Path $mesaDir 'x64\libgallium_wgl.dll') -Destination $installed -Force
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:MYTUBE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mytube-smoke'
          $env:MYTUBE_SCAN_ROOTS = Join-Path $env:RUNNER_TEMP 'mytube-empty'
          New-Item -ItemType Directory -Path $env:MYTUBE_SCAN_ROOTS -Force | Out-Null
          $startupLog = Join-Path $env:RUNNER_TEMP 'mytube-startup.log'
          $app = Start-Process (Join-Path $installed 'mytube.exe') -WorkingDirectory $installed -RedirectStandardError $startupLog -PassThru
          try {
            $catalog = Join-Path $env:MYTUBE_DATA_DIR 'library.sqlite3'
            foreach ($attempt in 1..30) {
              $app.Refresh()
              if ($app.HasExited) { throw "Player exited with code $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero -and (Get-Item -LiteralPath $catalog -ErrorAction SilentlyContinue).Length -gt 0) { return }
              Start-Sleep -Seconds 1
            }
            throw 'Player did not open its window and initialize the catalog'
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
            Get-Content -LiteralPath $startupLog
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            target/install/linux/*.deb
            target/install/*.zip
            target/install/*.dmg
          if-no-files-found: error

  release:
    needs: verify
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: desktop-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified installers
        run: gh run download "$GITHUB_RUN_ID" --pattern 'mytube-*' --dir installers
      - name: Publish release assets
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          names=("mytube_${version}_amd64.deb" "mytube-$version-windows-x64.zip")
          for platform in macos-arm64 macos-26-arm64; do
            names+=("mytube-$version-$platform.dmg" "mytube-$version-$platform.zip")
          done
          assets=()
          for name in "${names[@]}"; do
            file=$(find installers -type f -name "$name")
            if [[ ! -s "$file" ]]; then
              echo "::error::Expected one nonempty installer named $name"
              exit 1
            fi
            assets+=("$file")
          done

          if ! release=$(gh release view "$RELEASE_TAG" --json assets,isDraft); then
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "MyTube $RELEASE_TAG" --generate-notes
            exit 0
          fi

          for asset in "${assets[@]}"; do
            if ! jq -e --arg name "${asset##*/}" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release" >/dev/null; then
              gh release upload "$RELEASE_TAG" "$asset" --clobber
            fi
          done
          if jq -e '.isDraft' <<< "$release" >/dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
